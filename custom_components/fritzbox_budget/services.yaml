extend_time:
  name: Extend time
  description: Grant a managed device extra minutes (15, 30 or 60). If the budget is exhausted, internet access is re-enabled and the remaining time is set to the granted minutes.
  fields:
    device:
      name: Device
      description: MAC address of the managed device.
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    minutes:
      name: Minutes
      description: Additional minutes to grant.
      required: true
      selector:
        select:
          options:
            - "15"
            - "30"
            - "60"
